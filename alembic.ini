[alembic]
script_location = aos/db/migrations
prepend_sys_path = .
version_path_separator = os

# Alembic uses the sync psycopg3 driver for DDL migrations.
# The AOS_SYNC_DATABASE_URL env var must be set.
sqlalchemy.url = postgresql+psycopg://aos_user:aos_password@localhost:5432/aos_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
