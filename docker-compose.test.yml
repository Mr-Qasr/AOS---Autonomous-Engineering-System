# Standalone test stack for the AOS Phase 1 process-restart integration test.
# Run with its own project name to avoid touching the development stack:
#   docker compose -p aos-test -f docker-compose.test.yml up -d --build
# The DB listens on 5433 and the API on 8001 (the dev stack uses 5432/8000).
# The dedicated volume (postgres_test_data) lets the harness start from a
# genuinely fresh database each run (`down -v` is scoped to this file only).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aos_user
      POSTGRES_PASSWORD: aos_password
      POSTGRES_DB: aos_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aos_user -d aos_db"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AOS_DATABASE_URL: "postgresql+asyncpg://aos_user:aos_password@db:5432/aos_db"
      AOS_SYNC_DATABASE_URL: "postgresql+psycopg://aos_user:aos_password@db:5432/aos_db"
      AOS_CONTROLLER_ID: "api-controller-test"
      AOS_LEASE_TTL_SECONDS: "5"
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn aos.api.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_test_data: