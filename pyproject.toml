[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aos"
version = "0.1.0"
description = "Autonomous Engineering System Core Contracts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0,<3.0.0",
    "typing-extensions>=4.14.0",
]

[project.optional-dependencies]
server = [
    # HTTP layer
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    # Async ORM + migrations
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    # Async PostgreSQL driver (asyncpg for SQLAlchemy async, psycopg3 for Alembic/sync)
    "asyncpg>=0.29.0,<1.0.0",
    "psycopg[binary]>=3.1.0,<4.0.0",
]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "anyio[trio]>=4.0.0,<5.0.0",
    "httpx>=0.27.0,<1.0.0",
    # server deps needed for API tests
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
    "alembic>=1.13.0,<2.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "psycopg[binary]>=3.1.0,<4.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["aos*"]

