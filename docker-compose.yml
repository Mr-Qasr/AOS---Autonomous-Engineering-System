services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aos_user
      POSTGRES_PASSWORD: aos_password
      POSTGRES_DB: aos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aos_user -d aos_db"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AOS_DATABASE_URL: "postgresql+asyncpg://aos_user:aos_password@db:5432/aos_db"
      AOS_SYNC_DATABASE_URL: "postgresql+psycopg://aos_user:aos_password@db:5432/aos_db"
      AOS_CONTROLLER_ID: "api-controller-01"
      AOS_LEASE_TTL_SECONDS: "30"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn aos.api.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
